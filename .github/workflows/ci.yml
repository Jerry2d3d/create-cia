name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # macOS is here because the epic's definition of done names all three
        # platforms and this wizard touches the two things that differ most
        # between them: path separators and spawning a package manager. A
        # green Ubuntu run says nothing about either on a Mac.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The wizard never touches disk or the network under --dry-run, so the
      # whole suite runs offline on every OS in the matrix.
      - name: Test
        run: npm test

      - name: Pack (proves the files manifest)
        run: npm pack --dry-run
