# One-off diagnostic — who is NPM_TOKEN, and what may it publish?
# Manual trigger only. Prints the npm username and the token's package
# access; never prints the token (Actions masks secrets anyway). Delete
# this file once the first publish has succeeded.
name: npm token diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm $(npm --version)"
          echo "user: $(npm whoami 2>&1 || true)"
      - name: token type hints
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          t="${NODE_AUTH_TOKEN}"
          echo "token length: ${#t}"
          case "$t" in
            npm_*) echo "prefix: npm_ (classic or granular access token)";;
            *)     echo "prefix: other";;
          esac
      - name: read-only token facts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "--- npm profile get (2FA mode, no secrets) ---"
          npm profile get --json 2>&1 | grep -E '"(name|tfa|two_factor|created)"' || true
          echo "--- npm token list (type + scope of each token) ---"
          npm token list 2>&1 | head -20 || true
          echo "--- can it see the existing packages? ---"
          npm view css-is-awesome-mcp version 2>&1 | tail -1
